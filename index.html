<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@Shetompo_crazy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Nunito:wght@400;600&display=swap">
<link rel="icon" href="img/Shetrompocrazy.jpeg">
<style>
:root{--bg1:#1b1f6b;--bg2:#4a6cf0;--card:#f7f8ff;--ink:#1b1f6b;--line:#1b1f6b;--muted:#4b5090}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{font-family:Nunito,system-ui,sans-serif;color:#fff;background:linear-gradient(160deg,var(--bg2),var(--bg1)) fixed;padding:32px 16px 48px;overflow-x:hidden}
main{max-width:560px;margin:0 auto}
header{text-align:center}
.avatar{width:104px;height:104px;border-radius:50%;object-fit:cover;border:3px solid #fff;background:#fff}
h1{font-family:'Baloo 2',sans-serif;font-size:1.8rem;margin-top:10px}
.bio{opacity:.92;margin-top:4px}
.socials{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0 8px}
.socials a{color:#fff;text-decoration:none;font-weight:600;font-size:.9rem;padding:7px 14px;border:2px solid #ffffffaa;border-radius:99px}
.socials a:hover,.socials a:focus-visible{background:#fff;color:var(--ink);outline:none}
h2{font-family:'Baloo 2',sans-serif;text-align:center;font-size:1.25rem;margin:26px 0 12px}
.item{margin-bottom:14px}
.link{display:flex;align-items:center;gap:14px;background:var(--card);color:var(--ink);text-decoration:none;border:2px solid var(--line);border-radius:18px;padding:12px;margin-bottom:6px;min-height:72px}
.link:hover,.link:focus-visible{transform:translateY(-2px);outline:3px solid #fff}
.link img{width:64px;height:64px;border-radius:12px;object-fit:cover;object-position:top;flex:none}
.txt{flex:1;text-align:center}
.txt b{display:block;font-family:'Baloo 2',sans-serif;font-size:1.1rem;line-height:1.2}
.txt span{font-size:.92rem;color:var(--muted)}
.desc{font-size:.85rem;color:var(--ink);margin-top:5px;line-height:1.3}
.cupon{display:inline-block;margin-top:4px;font-weight:700;background:#ffe27a;color:#3b2f00;border-radius:8px;padding:2px 8px;font-size:.85rem}
.nota{font-size:.85rem;text-align:center;padding:0 10px;opacity:.95}
.nota b{color:#ffe27a}
footer{text-align:center;font-size:.8rem;opacity:.7;margin-top:28px}
@media (prefers-reduced-motion:no-preference){
  .link{transition:transform .15s}
  /* Animación: cada recuadro gira al entrar a la pantalla */
  .reveal{opacity:0;transform:perspective(900px) rotateY(-100deg) scale(.9);transform-origin:left center}
  .reveal.visible{opacity:1;transform:none;transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .5s}
}
</style>
</head>
<body>
<main>
  <header>
    <img class="avatar" id="avatar" alt="Foto de perfil">
    <h1 id="nombre"></h1>
    <p class="bio" id="bio"></p>
    <nav class="socials" id="redes" aria-label="Redes sociales"></nav>
  </header>
  <div id="secciones"></div>
  <footer id="pie"></footer>
</main>

<script>
/* ===== EDITA SOLO ESTA PARTE ===== */
const PERFIL = {
  nombre: "@Shetompo_crazy",
  bio: "Tecnología, streams y cursos",
  foto: "img/Shetrompocrazy.jpeg",   // la imagen está dentro de la carpeta img
  pie: "Algunos links pueden ser de afiliado."
};

const REDES = [
  { nombre: "TikTok",    url: "https://www.tiktok.com/@shetrompo_crazy" },
  { nombre: "Instagram", url: "https://www.instagram.com/kshetrompocrazy" },
  { nombre: "GitHub",    url: "https://github.com/KenyaRodriguezm" }
];

const WA = "525576258703"; // WhatsApp de SYSCATI
const QUIEN_ENVIA = "Kenya Mendieta";
const NOTA_SYSCATI = "Al inscribirte, di que te envía <b>Kenya Mendieta</b> y recibirás una promoción.";
const wa = curso => "https://wa.me/" + WA + "?text=" + encodeURIComponent("Hola, quiero informes del curso " + curso + ". Me envía " + QUIEN_ENVIA + ".");

/* "desc" es el texto explicativo que sale dentro de cada recuadro (opcional) */
const SECCIONES = [
  {
    titulo: "Links importantes",
    links: [
      { titulo: "Curso gratis de MCP", detalle: "Microsoft", desc: "Es un GitHub de Microsoft con un curso gratuito para aprender MCP desde cero.", url: "https://github.com/microsoft/mcp-for-beginners" },
      { titulo: "Agentes para principiantes", detalle: "Microsoft - GitHub", desc: "Es un GitHub que te enseña paso a paso a crear agentes de IA, con lecciones y código.", url: "https://github.com/microsoft/ai-agents-for-beginners" },
      { titulo: "Santander Open Academy", detalle: "Cursos de Santander", desc: "Aquí puedes tomar cursos gratuitos de distintos temas.", url: "https://www.santanderopenacademy.com/es/index.html" }
    ]
  },
  {
    titulo: "Bóveda retro: juegos clásicos",
    links: [
      { titulo: "Old-Games.com", detalle: "Biblioteca de juegos clásicos de PC", url: "https://www.old-games.com/" },
      { titulo: "Vimm's Lair", detalle: "Archivo de juegos y consolas retro", url: "https://vimm.net/" }
    ]
  },
  {
    titulo: "Cursos SYSCATI (en vivo por Google Meet)",
    nota: NOTA_SYSCATI,
    links: [
      { titulo: "Ciberseguridad en entornos profesionales", detalle: "Inicia 13 oct 2026 · Martes 15:00 a 19:00 · 20 h", url: wa("Ciberseguridad en entornos profesionales"), imagen: "img/syscati-ciberseguridad.jpg" },
      { titulo: "Fundamentos de Java e interfaces gráficas", detalle: "Inicia 10 oct 2026 · Sábado 16:00 a 20:00 · 20 h", url: wa("Fundamentos de Java e interfaces gráficas"), imagen: "img/syscati-java.jpg" },
      { titulo: "Excel empresarial con dashboards", detalle: "Inicia 12 oct 2026 · Lunes 19:00 a 22:00 · 15 h", url: wa("Excel empresarial con dashboards"), imagen: "img/syscati-excel.jpg" },
      { titulo: "Python para ciencia de datos", detalle: "Inicia 14 oct 2026 · Miércoles 19:00 a 22:00 · 18 h", url: wa("Python para ciencia de datos"), imagen: "img/syscati-python.jpg" },
      { titulo: "ABD con SQL Oracle y NoSQL MongoDB", detalle: "Inicia 12 oct 2026 · Lunes 16:00 a 19:00 · 15 h", url: wa("ABD con SQL Oracle y NoSQL MongoDB"), imagen: "img/syscati-sql.jpg" },
      { titulo: "Full Stack con Spring Boot y Bootstrap", detalle: "Inicia 14 oct 2026 · Miércoles 7:00 a 11:00 · 20 h", url: wa("Full Stack con Spring Boot y Bootstrap"), imagen: "img/syscati-fullstack.jpg" },
      { titulo: "Becas SYSCATI", detalle: "Precio normal $3,000 MXN · hasta 85% de beca a los primeros lugares", url: "https://forms.gle/bf2pguyBBARkj1Bz9", imagen: "img/syscati-becas.jpg", nota: "Al postularte, escribe que te envía <b>Kenya Mendieta</b>." }
    ]
  }
];
/* ===== FIN DE LO EDITABLE ===== */

const $ = id => document.getElementById(id);
const el = (tag, props = {}, kids = []) => {
  const e = Object.assign(document.createElement(tag), props);
  kids.forEach(k => e.append(k));
  return e;
};
const seguro = u => /^https?:\/\//i.test(u) ? u : "#";

$("nombre").textContent = PERFIL.nombre;
$("bio").textContent = PERFIL.bio;
$("pie").textContent = PERFIL.pie;
document.title = PERFIL.nombre;
const av = $("avatar");
av.onerror = () => { av.style.display = "none"; };
av.src = PERFIL.foto;

REDES.forEach(r => $("redes").append(
  el("a", { href: seguro(r.url), textContent: r.nombre, target: "_blank", rel: "noopener" })
));

const io = "IntersectionObserver" in window
  ? new IntersectionObserver((entradas, obs) => entradas.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add("visible"); obs.unobserve(e.target); }
    }), { threshold: 0.15 })
  : null;

SECCIONES.forEach(s => {
  $("secciones").append(el("h2", { textContent: s.titulo }));
  s.links.forEach((l, i) => {
    const txt = el("div", { className: "txt" }, [el("b", { textContent: l.titulo })]);
    if (l.detalle) txt.append(el("span", { textContent: l.detalle }));
    if (l.desc) txt.append(el("p", { className: "desc", textContent: l.desc }));
    if (l.cupon) txt.append(el("div", {}, [el("span", { className: "cupon", textContent: "Cupón: " + l.cupon })]));
    const a = el("a", { className: "link", href: seguro(l.url), target: "_blank", rel: "noopener sponsored" });
    if (l.imagen) a.append(el("img", { src: l.imagen, alt: "", loading: "lazy" }));
    a.append(txt);
    const item = el("div", { className: "item" }, [a]);
    const n = l.nota || s.nota;
    if (n) { const p = el("p", { className: "nota" }); p.innerHTML = n; item.append(p); }
    if (io) { item.classList.add("reveal"); item.style.transitionDelay = (i % 4) * 80 + "ms"; io.observe(item); }
    $("secciones").append(item);
  });
});
</script>
</body>
</html>
